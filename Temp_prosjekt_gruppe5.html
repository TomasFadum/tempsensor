
<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatursensor - Forside</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            background-attachment: fixed;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            color: #263047;
        }

        h1 {
            color: #7040b5;
            font-size: 34px;
            margin-top: 25px;
        }

        p {
            color: #526078;
            font-size: 17px;
        }

        button {
            background: linear-gradient(135deg, #8052c7, #6336a5);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
            box-shadow: 0 5px 12px rgba(75, 40, 120, 0.2);
            transition: 0.2s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #956bd4, #7549b8);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(75, 40, 120, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .temperatur {
            background: rgba(255, 255, 255, 0.85);
            padding: 25px;
            margin: 30px auto;
            border-radius: 18px;
            max-width: 400px;
            box-shadow: 0 8px 25px rgba(50, 40, 90, 0.12);
        }

        #temperature {
            font-size: 50px;
            color: #7040b5;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 27px;
            }

            button {
                padding: 12px 18px;
                margin: 6px;
            }
        }
    </style>
</head>

<body>

    <h1>Temperatursensor</h1>

    <p>Dette er vårt prosjekt.</p>

    <div class="temperatur">
        <h2>Temperaturen akkurat nå</h2>

        <div id="temperature">-- °C</div>

        <p id="status">Henter temperatur...</p>
    </div>

    <a href="Backlogg.html">
        <button>Backlogg</button>
    </a>

    <a href="koblingskjema.html">
        <button>Koblingsskjema</button>
    </a>

    <a href="kode.html">
        <button>Kode</button>
    </a>

    <a href="graf.html">
        <button>Graf</button>
    </a>

    <script>
        async function hentTemperatur() {
            const temperatureElement =
                document.getElementById("temperature");

            const statusElement =
                document.getElementById("status");

            try {
                const response = await fetch(
                    "/api/temperature?t=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("Serverfeil: " + response.status);
                }

                const data = await response.json();
                const temperatur = Number(data.temperature);

                if (!data.success || !Number.isFinite(temperatur)) {
                    throw new Error("Ugyldig temperaturdata");
                }

                temperatureElement.textContent =
                   temperatur.toLocaleString("nb-NO", {
                 minimumFractionDigits: 1,
                 maximumFractionDigits: 1,
               }) + " °C";

                if (temperatur < 18 || temperatur > 26) {
                    statusElement.textContent = "Alarmtemperatur!";
                    statusElement.style.color = "red";
                } else if (temperatur < 20 || temperatur > 22) {
                    statusElement.textContent =
                        "Temperaturen er litt utenfor idealområdet";
                    statusElement.style.color = "#b8860b";
                } else {
                    statusElement.textContent =
                        "Temperaturen er perfekt!";
                    statusElement.style.color = "green";
                }

            } catch (error) {
                console.error("Temperaturfeil:", error);

                temperatureElement.textContent = "-- °C";
                statusElement.textContent =
                    "Kunne ikke hente temperatur";
                statusElement.style.color = "red";
            }
        }

        hentTemperatur();
        setInterval(hentTemperatur, 2000);
    </script>

</body>
</html>
